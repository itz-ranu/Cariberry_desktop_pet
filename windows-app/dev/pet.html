<!doctype html>
<html><head><meta charset="utf-8"><title>pet harness</title>
<style>
  html, body { margin: 0; width: 270px; height: 236px; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 270px; height: 236px; }
  #bubbleZone { position: absolute; left: 0; width: 270px; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  #bubble { display: none; flex-direction: column; align-items: center; padding: 0 16px; animation: pop .32s cubic-bezier(.34, 1.56, .64, 1); transform-origin: bottom center; }
  #bubble .box { font: 700 13px/1.25 ui-rounded, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: var(--ink, #523f63); text-align: center;
    max-width: 224px; padding: 10px 15px; border-radius: 20px; background: linear-gradient(#fff, var(--bg, #fff7fa)); border: 2.4px solid var(--accent, #cdb3f7);
    box-shadow: 0 4px 9px color-mix(in srgb, var(--accent, #cdb3f7) 45%, transparent); }
  #bubble .tail { width: 16px; height: 10px; margin: -1.5px 0 0 12px; align-self: flex-start; position: relative; }
  #bubble .tail::before, #bubble .tail::after { content: ''; position: absolute; left: 0; top: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; }
  #bubble .tail::before { border-top: 10px solid var(--accent, #cdb3f7); }
  #bubble .tail::after { top: -2.4px; border-top: 8px solid var(--bg, #fff7fa); left: 2px; border-left-width: 6px; border-right-width: 6px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  #close { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: none; pointer-events: none; }
  #close .ring { position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid #fff; opacity: .9; transform: scale(1.12); transition: transform .45s ease-out, opacity .45s ease-out; }
  #close .dot { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); background: radial-gradient(circle at 35% 30%, #ff858f, #e63857 90%); box-shadow: 0 2px 5px rgba(230,50,80,.5);
    display: grid; place-items: center; color: #fff; font: 900 13px system-ui; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
  #close.pressed .dot { transform: scale(.76); } #close.pressed .ring { transform: scale(2.3); opacity: 0; }
</style></head>
<body style="background:linear-gradient(#cfd8f6,#f6dff0);width:270px;height:236px">
<canvas id="stage"></canvas>
<div id="bubbleZone"><div id="bubble"><div class="box" id="bubbleText"></div><div class="tail"></div></div></div>
<div id="close"><div class="ring"></div><div class="dot">✕</div></div>
<script>
// a stand-in for the Electron bridge, so the pet page can be looked at in any browser
const handlers = {}
window.__log = []
window.cari = {
  platform: 'dev',
  invoke: async (ch, ...a) => {
    window.__log.push([ch, ...a])
    if (ch === 'load') return { save: {}, prefs: {}, rules: null }
    if (ch === 'screens') return { primaryH: 900, displays: [{ work: { x: 0, y: 0, width: 1440, height: 860 }, bounds: { x: 0, y: 0, width: 1440, height: 900 }, scale: 1 }] }
    return null
  },
  send: (ch, ...a) => { window.__log.push([ch, ...a]); if (ch === 'rpc:result') window.__rpc?.(...a) },
  on: (ch, cb) => { (handlers[ch] ||= []).push(cb); return () => {} },
}
window.__emit = (ch, ...a) => (handlers[ch] || []).forEach((f) => f(...a))
</script>
<script type="module" src="../src/renderer/pet.js"></script>
</body></html>
